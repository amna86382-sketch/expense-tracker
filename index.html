<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <header class="page-header">
            <div>
             <h1>Expense Tracker</h1>
</div>
        </header>
        <section class="form-section">
            <form id="expenseForm">
            <div class="form-group">
            <label for="title">Expense Title</label>
        <input
             type="text" id="title"placeholder="e.g"required>
 </div>
         <div class="form-group">
         <label for="amount">Amount (Rs.)</label>
    <input
             type="number" id="amount"placeholder="Enter amount"step="any"required>
 </div>
      <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="">Select category</option>
                        <option value="Food">Food</option>
                        <option value="Travel">Travel</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Education">Education</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
    </div>
         <button type="submit" class="add-btn">Add Expense</button>
 </form>
        </section>
        <section class="total-card">
 <div>
             <p class="total-label">Total Expenses</p>
             <h2>Rs. <span id="total">0</span></h2>
            </div>
     <div class="total-icon">↗</div>
        </section>
        <section class="expenses-section">
     <div class="section-heading">
         <h2>Recent Expenses</h2>
            </div>
            <div class="table-container">
             <table>
     <thead>
        <tr>
        <th>Title</th>
     <th>Amount</th>
    <th>Category</th>
     <th>Date</th>
     <th>Action</th>
 </tr>
    </thead>
                 <tbody id="expenseList"></tbody>
                </table>
 </div>
        </section>
    </div>
    <script src="./script.js"></script>
</body>
</html>
